name: 同步上传的作品

on:
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'work-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Build the site from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
